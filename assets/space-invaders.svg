<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" width="800" height="260" font-family="'Courier New',monospace">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="100%" stop-color="#0a0014"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="scan" width="2" height="3" patternUnits="userSpaceOnUse">
      <rect width="2" height="1" fill="#00ff41" opacity="0.05"/>
    </pattern>

    <!-- Invader row 1 (squid) -->
    <g id="inv1">
      <rect x="6"  y="0"  width="2" height="2"/>
      <rect x="12" y="0"  width="2" height="2"/>
      <rect x="4"  y="2"  width="2" height="2"/>
      <rect x="6"  y="2"  width="2" height="2"/>
      <rect x="12" y="2"  width="2" height="2"/>
      <rect x="14" y="2"  width="2" height="2"/>
      <rect x="2"  y="4"  width="16" height="2"/>
      <rect x="0"  y="6"  width="4" height="2"/>
      <rect x="6"  y="6"  width="2" height="2"/>
      <rect x="12" y="6"  width="2" height="2"/>
      <rect x="16" y="6"  width="4" height="2"/>
      <rect x="0"  y="8"  width="20" height="2"/>
      <rect x="2"  y="10" width="2" height="2"/>
      <rect x="8"  y="10" width="4" height="2"/>
      <rect x="16" y="10" width="2" height="2"/>
    </g>
    <!-- Invader row 2 (crab) -->
    <g id="inv2">
      <rect x="2"  y="0"  width="2" height="2"/>
      <rect x="16" y="0"  width="2" height="2"/>
      <rect x="4"  y="2"  width="2" height="2"/>
      <rect x="14" y="2"  width="2" height="2"/>
      <rect x="2"  y="4"  width="16" height="2"/>
      <rect x="0"  y="6"  width="4" height="2"/>
      <rect x="6"  y="6"  width="2" height="2"/>
      <rect x="12" y="6"  width="2" height="2"/>
      <rect x="16" y="6"  width="4" height="2"/>
      <rect x="0"  y="8"  width="20" height="2"/>
      <rect x="0"  y="10" width="2" height="2"/>
      <rect x="6"  y="10" width="8" height="2"/>
      <rect x="18" y="10" width="2" height="2"/>
    </g>
    <!-- Invader row 3 (octopus) -->
    <g id="inv3">
      <rect x="4"  y="0"  width="12" height="2"/>
      <rect x="2"  y="2"  width="16" height="2"/>
      <rect x="0"  y="4"  width="20" height="2"/>
      <rect x="0"  y="6"  width="4"  height="2"/>
      <rect x="8"  y="6"  width="4"  height="2"/>
      <rect x="16" y="6"  width="4"  height="2"/>
      <rect x="0"  y="8"  width="20" height="2"/>
      <rect x="4"  y="10" width="2"  height="2"/>
      <rect x="14" y="10" width="2"  height="2"/>
    </g>
    <!-- Player ship -->
    <g id="ship">
      <rect x="14" y="0"  width="2"  height="2"/>
      <rect x="12" y="2"  width="6"  height="2"/>
      <rect x="12" y="4"  width="6"  height="2"/>
      <rect x="0"  y="6"  width="30" height="4"/>
      <rect x="0"  y="10" width="30" height="2"/>
    </g>
  </defs>

  <!-- Background -->
  <rect width="800" height="260" fill="url(#bgGrad)"/>

  <!-- Starfield -->
  <g fill="#ffffff" opacity="0.55">
    <circle cx="40"  cy="22"  r="0.8"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.1s" repeatCount="indefinite"/></circle>
    <circle cx="120" cy="50"  r="0.6"><animate attributeName="opacity" values="0.3;0.9;0.3" dur="3.3s" repeatCount="indefinite"/></circle>
    <circle cx="210" cy="14"  r="0.9"><animate attributeName="opacity" values="0.1;1;0.1" dur="1.8s" repeatCount="indefinite"/></circle>
    <circle cx="305" cy="38"  r="0.5"><animate attributeName="opacity" values="0.4;1;0.4" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="430" cy="20"  r="0.7"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="2.9s" repeatCount="indefinite"/></circle>
    <circle cx="540" cy="55"  r="0.6"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="640" cy="18"  r="0.8"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="730" cy="42"  r="0.5"><animate attributeName="opacity" values="0.4;1;0.4" dur="1.9s" repeatCount="indefinite"/></circle>
    <circle cx="80"  cy="200" r="0.6"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="2.7s" repeatCount="indefinite"/></circle>
    <circle cx="680" cy="210" r="0.7"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.4s" repeatCount="indefinite"/></circle>
  </g>

  <!-- HUD -->
  <text x="20"  y="22" fill="#ff003c" font-size="11" letter-spacing="2" filter="url(#glow)">SCORE&lt;1&gt;</text>
  <text x="20"  y="36" fill="#00ff41" font-size="13" letter-spacing="2" filter="url(#glow)">
    <tspan>0000</tspan>
    <animate attributeName="textContent" values="0000;0030;0090;0210;0420;0680;0990;1340;1740;2180" dur="11s" repeatCount="indefinite"/>
  </text>
  <text x="380" y="22" fill="#ff003c" font-size="11" letter-spacing="2" filter="url(#glow)" text-anchor="middle">HI-SCORE</text>
  <text x="380" y="36" fill="#00ff41" font-size="13" letter-spacing="2" filter="url(#glow)" text-anchor="middle">9999</text>
  <text x="720" y="22" fill="#ff003c" font-size="11" letter-spacing="2" filter="url(#glow)" text-anchor="end">CREDIT 01</text>
  <text x="720" y="36" fill="#00ff41" font-size="13" letter-spacing="2" filter="url(#glow)" text-anchor="end">LV-7</text>

  <!-- Invader fleet (marches horizontally + vertically) -->
  <g filter="url(#glow)">
    <g>
      <!-- horizontal sweep -->
      <animateTransform attributeName="transform" type="translate"
        values="0 0; 60 0; 60 18; 0 18; 0 36; 60 36; 60 54; 0 54"
        keyTimes="0;0.14;0.16;0.30;0.32;0.46;0.48;1"
        dur="11s" repeatCount="indefinite"/>

      <!-- Row 1 - magenta octopus -->
      <g fill="#ff00aa">
        <g><use href="#inv3" x="120" y="58"/>
          <animateTransform attributeName="transform" type="translate" values="0 0;2 0;0 0" dur="0.7s" repeatCount="indefinite"/></g>
        <g><use href="#inv3" x="180" y="58"/>
          <animateTransform attributeName="transform" type="translate" values="0 0;2 0;0 0" dur="0.7s" repeatCount="indefinite"/></g>
        <g><use href="#inv3" x="240" y="58"/>
          <animateTransform attributeName="transform" type="translate" values="0 0;2 0;0 0" dur="0.7s" repeatCount="indefinite"/></g>
        <g><use href="#inv3" x="300" y="58"/>
          <animateTransform attributeName="transform" type="translate" values="0 0;2 0;0 0" dur="0.7s" repeatCount="indefinite"/></g>
        <g><use href="#inv3" x="360" y="58"/>
          <animateTransform attributeName="transform" type="translate" values="0 0;2 0;0 0" dur="0.7s" repeatCount="indefinite"/></g>
        <g><use href="#inv3" x="420" y="58"/>
          <animateTransform attributeName="transform" type="translate" values="0 0;2 0;0 0" dur="0.7s" repeatCount="indefinite"/></g>
        <g><use href="#inv3" x="480" y="58"/>
          <animateTransform attributeName="transform" type="translate" values="0 0;2 0;0 0" dur="0.7s" repeatCount="indefinite"/></g>
        <g><use href="#inv3" x="540" y="58"/>
          <animateTransform attributeName="transform" type="translate" values="0 0;2 0;0 0" dur="0.7s" repeatCount="indefinite"/></g>
      </g>

      <!-- Row 2 - cyan crab -->
      <g fill="#00f0ff">
        <g><use href="#inv2" x="120" y="80"/>
          <animateTransform attributeName="transform" type="translate" values="0 0;2 0;0 0" dur="0.7s" repeatCount="indefinite"/></g>
        <g><use href="#inv2" x="180" y="80"/>
          <animateTransform attributeName="transform" type="translate" values="0 0;2 0;0 0" dur="0.7s" repeatCount="indefinite"/></g>
        <g><use href="#inv2" x="240" y="80"/>
          <animateTransform attributeName="transform" type="translate" values="0 0;2 0;0 0" dur="0.7s" repeatCount="indefinite"/></g>
        <g><use href="#inv2" x="300" y="80"/>
          <animateTransform attributeName="transform" type="translate" values="0 0;2 0;0 0" dur="0.7s" repeatCount="indefinite"/></g>
        <g><use href="#inv2" x="360" y="80"/>
          <animateTransform attributeName="transform" type="translate" values="0 0;2 0;0 0" dur="0.7s" repeatCount="indefinite"/></g>
        <g><use href="#inv2" x="420" y="80"/>
          <animateTransform attributeName="transform" type="translate" values="0 0;2 0;0 0" dur="0.7s" repeatCount="indefinite"/></g>
        <g><use href="#inv2" x="480" y="80"/>
          <animateTransform attributeName="transform" type="translate" values="0 0;2 0;0 0" dur="0.7s" repeatCount="indefinite"/></g>
        <g><use href="#inv2" x="540" y="80"/>
          <animateTransform attributeName="transform" type="translate" values="0 0;2 0;0 0" dur="0.7s" repeatCount="indefinite"/></g>
      </g>

      <!-- Row 3 - green squid -->
      <g fill="#00ff41">
        <g><use href="#inv1" x="120" y="102"/>
          <animateTransform attributeName="transform" type="translate" values="0 0;2 0;0 0" dur="0.7s" repeatCount="indefinite"/></g>
        <g><use href="#inv1" x="180" y="102"/>
          <animateTransform attributeName="transform" type="translate" values="0 0;2 0;0 0" dur="0.7s" repeatCount="indefinite"/></g>
        <g opacity="1">
          <use href="#inv1" x="240" y="102"/>
          <animate attributeName="opacity" values="1;1;1;1;1;1;1;0;0" keyTimes="0;0.5;0.55;0.6;0.65;0.7;0.74;0.75;1" dur="11s" repeatCount="indefinite"/>
        </g>
        <g><use href="#inv1" x="300" y="102"/>
          <animateTransform attributeName="transform" type="translate" values="0 0;2 0;0 0" dur="0.7s" repeatCount="indefinite"/></g>
        <g><use href="#inv1" x="360" y="102"/>
          <animateTransform attributeName="transform" type="translate" values="0 0;2 0;0 0" dur="0.7s" repeatCount="indefinite"/></g>
        <g><use href="#inv1" x="420" y="102"/>
          <animateTransform attributeName="transform" type="translate" values="0 0;2 0;0 0" dur="0.7s" repeatCount="indefinite"/></g>
        <g><use href="#inv1" x="480" y="102"/>
          <animateTransform attributeName="transform" type="translate" values="0 0;2 0;0 0" dur="0.7s" repeatCount="indefinite"/></g>
        <g><use href="#inv1" x="540" y="102"/>
          <animateTransform attributeName="transform" type="translate" values="0 0;2 0;0 0" dur="0.7s" repeatCount="indefinite"/></g>
      </g>
    </g>
  </g>

  <!-- Player laser shot -->
  <rect x="262" y="120" width="2" height="0" fill="#ffffff" filter="url(#glow)">
    <animate attributeName="y"      values="195;120;120" keyTimes="0;0.5;1" dur="1.5s" begin="4s" repeatCount="indefinite"/>
    <animate attributeName="height" values="10;75;0"    keyTimes="0;0.5;1" dur="1.5s" begin="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;1;0"     keyTimes="0;0.5;1" dur="1.5s" begin="4s" repeatCount="indefinite"/>
  </rect>

  <!-- Hit flash where invader explodes -->
  <g transform="translate(262 108)" opacity="0">
    <animate attributeName="opacity" values="0;0;1;0" keyTimes="0;0.74;0.76;0.82" dur="11s" repeatCount="indefinite"/>
    <g fill="#ffffff">
      <rect x="-6" y="0"  width="2" height="2"/>
      <rect x="6"  y="0"  width="2" height="2"/>
      <rect x="14" y="0"  width="2" height="2"/>
      <rect x="-2" y="4"  width="2" height="2"/>
      <rect x="10" y="4"  width="2" height="2"/>
      <rect x="2"  y="8"  width="2" height="2"/>
      <rect x="18" y="8"  width="2" height="2"/>
      <rect x="-4" y="12" width="2" height="2"/>
      <rect x="14" y="12" width="2" height="2"/>
    </g>
  </g>

  <!-- Bunkers -->
  <g fill="#00ff41" filter="url(#glow)">
    <g transform="translate(100 180)">
      <rect x="0" y="4" width="36" height="14"/>
      <rect x="0" y="0" width="36" height="4"/>
      <rect x="4" y="-2" width="28" height="2"/>
      <rect x="12" y="10" width="12" height="10" fill="#000"/>
    </g>
    <g transform="translate(260 180)">
      <rect x="0" y="4" width="36" height="14"/>
      <rect x="0" y="0" width="36" height="4"/>
      <rect x="4" y="-2" width="28" height="2"/>
      <rect x="12" y="10" width="12" height="10" fill="#000"/>
      <rect x="18" y="2" width="4" height="4" fill="#000"/>
    </g>
    <g transform="translate(420 180)">
      <rect x="0" y="4" width="36" height="14"/>
      <rect x="0" y="0" width="36" height="4"/>
      <rect x="4" y="-2" width="28" height="2"/>
      <rect x="12" y="10" width="12" height="10" fill="#000"/>
      <rect x="6" y="6" width="3" height="3" fill="#000"/>
      <rect x="28" y="4" width="3" height="3" fill="#000"/>
    </g>
    <g transform="translate(580 180)">
      <rect x="0" y="4" width="36" height="14"/>
      <rect x="0" y="0" width="36" height="4"/>
      <rect x="4" y="-2" width="28" height="2"/>
      <rect x="12" y="10" width="12" height="10" fill="#000"/>
    </g>
  </g>

  <!-- Player ship (auto-moves) -->
  <g fill="#00ff41" filter="url(#glow)">
    <use href="#ship" y="195">
      <animate attributeName="x" values="40;200;250;250;520;620;180;260;260;700;40"
               keyTimes="0;0.12;0.27;0.36;0.50;0.62;0.74;0.80;0.85;0.95;1"
               dur="11s" repeatCount="indefinite"/>
    </use>
  </g>

  <!-- Floor line -->
  <rect x="0" y="220" width="800" height="2" fill="#00ff41" opacity="0.6"/>

  <!-- Bottom marquee -->
  <text x="400" y="245" fill="#ff003c" font-size="11" letter-spacing="4" text-anchor="middle" filter="url(#glow)">
    &gt; INSERT  COIN  TO  CONTINUE &lt;
    <animate attributeName="opacity" values="1;0.15;1" dur="1.4s" repeatCount="indefinite"/>
  </text>

  <!-- Scanlines overlay (last so it sits on top) -->
  <rect width="800" height="260" fill="url(#scan)" pointer-events="none"/>
  <rect width="800" height="260" fill="#00ff41" opacity="0.02" pointer-events="none">
    <animate attributeName="opacity" values="0.02;0.05;0.02" dur="0.15s" repeatCount="indefinite"/>
  </rect>
</svg>
