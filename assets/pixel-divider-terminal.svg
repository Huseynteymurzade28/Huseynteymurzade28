<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 20" shape-rendering="crispEdges">
  <defs>
    <style>
      @keyframes cursor-blink {
        0%, 49%   { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      @keyframes twinkle {
        0%, 100% { opacity: 0.3; }
        50%      { opacity: 1; }
      }
      .cursor { animation: cursor-blink 1s steps(1) infinite; }
      .dot1   { animation: twinkle 2s ease-in-out infinite; }
      .dot2   { animation: twinkle 2s ease-in-out infinite 0.5s; }
      .dot3   { animation: twinkle 2s ease-in-out infinite 1s; }
    </style>
  </defs>

  <!-- left line -->
  <rect x="40"  y="10" width="120" height="1" fill="#45475a"/>
  <rect x="50"  y="9"  width="2"   height="1" fill="#45475a" opacity="0.5"/>
  <rect x="70"  y="9"  width="2"   height="1" fill="#45475a" opacity="0.5"/>
  <rect x="90"  y="9"  width="2"   height="1" fill="#45475a" opacity="0.5"/>
  <rect x="110" y="9"  width="2"   height="1" fill="#45475a" opacity="0.5"/>
  <rect x="130" y="9"  width="2"   height="1" fill="#45475a" opacity="0.5"/>

  <!-- floating dot left -->
  <rect class="dot1" x="170" y="8" width="2" height="2" fill="#a6e3a1"/>

  <!-- pixel terminal window -->
  <g>
    <!-- frame -->
    <rect x="180" y="4"  width="40" height="12" fill="#313244"/>
    <!-- title bar -->
    <rect x="180" y="4"  width="40" height="3"  fill="#45475a"/>
    <!-- 3 traffic light dots -->
    <rect x="182" y="5"  width="1"  height="1"  fill="#f38ba8"/>
    <rect x="185" y="5"  width="1"  height="1"  fill="#f9e2af"/>
    <rect x="188" y="5"  width="1"  height="1"  fill="#a6e3a1"/>
    <!-- terminal content -->
    <rect x="182" y="9"  width="1"  height="1"  fill="#a6e3a1"/>
    <rect x="184" y="9"  width="1"  height="1"  fill="#a6e3a1"/>
    <rect x="186" y="9"  width="6"  height="1"  fill="#cdd6f4"/>
    <rect x="182" y="11" width="1"  height="1"  fill="#a6e3a1"/>
    <rect x="184" y="11" width="1"  height="1"  fill="#a6e3a1"/>
    <rect x="186" y="11" width="10" height="1"  fill="#cba6f7"/>
    <rect x="182" y="13" width="1"  height="1"  fill="#a6e3a1"/>
    <rect x="184" y="13" width="1"  height="1"  fill="#a6e3a1"/>
    <!-- blinking cursor -->
    <rect class="cursor" x="186" y="13" width="2" height="1" fill="#f9e2af"/>
  </g>

  <!-- floating dot right -->
  <rect class="dot3" x="228" y="12" width="2" height="2" fill="#cba6f7"/>

  <!-- right line -->
  <rect x="240" y="10" width="120" height="1" fill="#45475a"/>
  <rect x="260" y="9"  width="2"   height="1" fill="#45475a" opacity="0.5"/>
  <rect x="280" y="9"  width="2"   height="1" fill="#45475a" opacity="0.5"/>
  <rect x="300" y="9"  width="2"   height="1" fill="#45475a" opacity="0.5"/>
  <rect x="320" y="9"  width="2"   height="1" fill="#45475a" opacity="0.5"/>
  <rect x="340" y="9"  width="2"   height="1" fill="#45475a" opacity="0.5"/>
</svg>
