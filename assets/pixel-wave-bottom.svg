<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 120" shape-rendering="crispEdges" preserveAspectRatio="none">
  <defs>
    <style>
      @keyframes drift-slow { 0%,100% { transform: translateX(0); } 50% { transform: translateX(8px); } }
      @keyframes drift-med  { 0%,100% { transform: translateX(0); } 50% { transform: translateX(-12px); } }
      @keyframes twinkle    { 0%,100% { opacity: 0.2; } 50% { opacity: 1; } }
      @keyframes blink      { 0%,40%,100% { opacity: 1; } 50%,90% { opacity: 0.3; } }
      @keyframes moonglow   { 0%,100% { opacity: 0.85; } 50% { opacity: 1; } }
      .cloud { animation: drift-slow 14s ease-in-out infinite; }
      .hills-back  { animation: drift-med  12s ease-in-out infinite; }
      .star { animation: twinkle 3s ease-in-out infinite; }
      .star:nth-of-type(2)  { animation-delay: 0.4s; }
      .star:nth-of-type(3)  { animation-delay: 0.8s; }
      .star:nth-of-type(4)  { animation-delay: 1.2s; }
      .star:nth-of-type(5)  { animation-delay: 1.6s; }
      .star:nth-of-type(6)  { animation-delay: 2.0s; }
      .star:nth-of-type(7)  { animation-delay: 2.4s; }
      .star:nth-of-type(8)  { animation-delay: 0.6s; }
      .star:nth-of-type(9)  { animation-delay: 1.0s; }
      .window { animation: blink 5s ease-in-out infinite; }
      .window:nth-of-type(2) { animation-delay: 1s; }
      .window:nth-of-type(3) { animation-delay: 2s; }
      .window:nth-of-type(4) { animation-delay: 0.5s; }
      .window:nth-of-type(5) { animation-delay: 1.5s; }
      .moon { animation: moonglow 4s ease-in-out infinite; }
    </style>
  </defs>

  <!-- back hills (purple haze) -->
  <g class="hills-back" fill="#4a3a6e">
    <rect x="-20" y="14" width="80" height="30"/>
    <rect x="60"  y="10" width="60" height="34"/>
    <rect x="120" y="6"  width="40" height="38"/>
    <rect x="160" y="10" width="60" height="34"/>
    <rect x="220" y="14" width="80" height="30"/>
    <rect x="300" y="8"  width="60" height="36"/>
    <rect x="360" y="4"  width="40" height="40"/>
    <rect x="400" y="8"  width="60" height="36"/>
    <rect x="460" y="14" width="80" height="30"/>
    <rect x="540" y="10" width="60" height="34"/>
    <rect x="600" y="6"  width="40" height="38"/>
    <rect x="640" y="10" width="60" height="34"/>
    <rect x="700" y="14" width="80" height="30"/>
    <rect x="780" y="10" width="60" height="34"/>
  </g>

  <!-- pixel moon (crescent) -->
  <g class="moon">
    <rect x="100" y="20" width="14" height="2" fill="#f9e2af"/>
    <rect x="96"  y="22" width="18" height="2" fill="#f9e2af"/>
    <rect x="94"  y="24" width="20" height="2" fill="#f9e2af"/>
    <rect x="92"  y="26" width="20" height="2" fill="#f9e2af"/>
    <rect x="92"  y="28" width="20" height="2" fill="#f9e2af"/>
    <rect x="94"  y="30" width="18" height="2" fill="#f9e2af"/>
    <rect x="96"  y="32" width="16" height="2" fill="#f9e2af"/>
    <rect x="100" y="34" width="12" height="2" fill="#f9e2af"/>
    <!-- moon shadow makes it crescent -->
    <rect x="104" y="22" width="14" height="2" fill="#1e1e2e"/>
    <rect x="104" y="24" width="16" height="2" fill="#1e1e2e"/>
    <rect x="104" y="26" width="16" height="2" fill="#1e1e2e"/>
    <rect x="104" y="28" width="16" height="2" fill="#1e1e2e"/>
    <rect x="104" y="30" width="14" height="2" fill="#1e1e2e"/>
    <rect x="104" y="32" width="12" height="2" fill="#1e1e2e"/>
  </g>

  <!-- twinkling stars -->
  <g fill="#f9e2af">
    <rect class="star" x="40"  y="8"  width="2" height="2"/>
    <rect class="star" x="180" y="14" width="2" height="2"/>
    <rect class="star" x="240" y="4"  width="2" height="2"/>
    <rect class="star" x="340" y="12" width="2" height="2"/>
    <rect class="star" x="480" y="6"  width="2" height="2"/>
    <rect class="star" x="560" y="14" width="2" height="2"/>
    <rect class="star" x="620" y="8"  width="2" height="2"/>
    <rect class="star" x="720" y="4"  width="2" height="2"/>
    <rect class="star" x="760" y="12" width="2" height="2"/>
  </g>

  <!-- thin clouds -->
  <g class="cloud" fill="#cba6f7" opacity="0.4">
    <rect x="280" y="20" width="40" height="2"/>
    <rect x="276" y="22" width="48" height="2"/>
    <rect x="500" y="16" width="36" height="2"/>
    <rect x="496" y="18" width="44" height="2"/>
  </g>

  <!-- city silhouette (front) -->
  <g fill="#1e1830">
    <!-- building 1 -->
    <rect x="20"  y="60" width="40" height="60"/>
    <!-- building 2 (taller, antenna) -->
    <rect x="65"  y="50" width="30" height="70"/>
    <rect x="76"  y="42" width="4"  height="8"/>
    <!-- building 3 -->
    <rect x="100" y="68" width="50" height="52"/>
    <!-- building 4 (pointed top) -->
    <rect x="155" y="58" width="35" height="62"/>
    <rect x="165" y="50" width="15" height="8"/>
    <rect x="170" y="44" width="5"  height="6"/>
    <!-- building 5 -->
    <rect x="195" y="64" width="45" height="56"/>
    <!-- building 6 (tallest) -->
    <rect x="245" y="44" width="40" height="76"/>
    <rect x="260" y="36" width="10" height="8"/>
    <!-- building 7 -->
    <rect x="290" y="62" width="50" height="58"/>
    <!-- building 8 -->
    <rect x="345" y="56" width="35" height="64"/>
    <!-- building 9 -->
    <rect x="385" y="68" width="45" height="52"/>
    <!-- building 10 (with antenna) -->
    <rect x="435" y="52" width="30" height="68"/>
    <rect x="446" y="44" width="4"  height="8"/>
    <!-- building 11 -->
    <rect x="470" y="64" width="50" height="56"/>
    <!-- building 12 -->
    <rect x="525" y="58" width="35" height="62"/>
    <!-- building 13 (tallest right) -->
    <rect x="565" y="46" width="40" height="74"/>
    <rect x="580" y="38" width="10" height="8"/>
    <!-- building 14 -->
    <rect x="610" y="62" width="50" height="58"/>
    <!-- building 15 -->
    <rect x="665" y="56" width="35" height="64"/>
    <rect x="675" y="48" width="15" height="8"/>
    <!-- building 16 -->
    <rect x="705" y="64" width="45" height="56"/>
    <!-- building 17 -->
    <rect x="755" y="58" width="45" height="62"/>
  </g>

  <!-- city window lights (warm yellow, blinking) -->
  <g fill="#f9e2af">
    <rect class="window" x="30"  y="70"  width="3" height="3"/>
    <rect class="window" x="40"  y="80"  width="3" height="3"/>
    <rect class="window" x="50"  y="90"  width="3" height="3"/>
    <rect class="window" x="72"  y="60"  width="3" height="3"/>
    <rect class="window" x="82"  y="74"  width="3" height="3"/>
    <rect class="window" x="72"  y="88"  width="3" height="3"/>
    <rect class="window" x="115" y="76"  width="3" height="3"/>
    <rect class="window" x="130" y="84"  width="3" height="3"/>
    <rect class="window" x="115" y="96"  width="3" height="3"/>
    <rect class="window" x="165" y="70"  width="3" height="3"/>
    <rect class="window" x="178" y="84"  width="3" height="3"/>
    <rect class="window" x="210" y="76"  width="3" height="3"/>
    <rect class="window" x="225" y="90"  width="3" height="3"/>
    <rect class="window" x="255" y="56"  width="3" height="3"/>
    <rect class="window" x="270" y="68"  width="3" height="3"/>
    <rect class="window" x="255" y="82"  width="3" height="3"/>
    <rect class="window" x="270" y="96"  width="3" height="3"/>
    <rect class="window" x="300" y="74"  width="3" height="3"/>
    <rect class="window" x="315" y="86"  width="3" height="3"/>
    <rect class="window" x="330" y="98"  width="3" height="3"/>
    <rect class="window" x="355" y="68"  width="3" height="3"/>
    <rect class="window" x="368" y="82"  width="3" height="3"/>
    <rect class="window" x="395" y="78"  width="3" height="3"/>
    <rect class="window" x="410" y="92"  width="3" height="3"/>
    <rect class="window" x="445" y="62"  width="3" height="3"/>
    <rect class="window" x="455" y="78"  width="3" height="3"/>
    <rect class="window" x="445" y="94"  width="3" height="3"/>
    <rect class="window" x="485" y="74"  width="3" height="3"/>
    <rect class="window" x="500" y="86"  width="3" height="3"/>
    <rect class="window" x="535" y="68"  width="3" height="3"/>
    <rect class="window" x="548" y="82"  width="3" height="3"/>
    <rect class="window" x="575" y="56"  width="3" height="3"/>
    <rect class="window" x="590" y="68"  width="3" height="3"/>
    <rect class="window" x="575" y="82"  width="3" height="3"/>
    <rect class="window" x="590" y="96"  width="3" height="3"/>
    <rect class="window" x="625" y="74"  width="3" height="3"/>
    <rect class="window" x="640" y="86"  width="3" height="3"/>
    <rect class="window" x="675" y="68"  width="3" height="3"/>
    <rect class="window" x="688" y="84"  width="3" height="3"/>
    <rect class="window" x="715" y="76"  width="3" height="3"/>
    <rect class="window" x="730" y="90"  width="3" height="3"/>
    <rect class="window" x="765" y="70"  width="3" height="3"/>
    <rect class="window" x="780" y="86"  width="3" height="3"/>
  </g>
</svg>
