<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 80" shape-rendering="crispEdges" preserveAspectRatio="none">
  <defs>
    <style>
      @keyframes drift {
        0%, 100% { transform: translateX(0); }
        50% { transform: translateX(8px); }
      }
      @keyframes twinkle {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 1; }
      }
      .wave1 { animation: drift 7s ease-in-out infinite; }
      .wave2 { animation: drift 9s ease-in-out infinite reverse; }
      .star { animation: twinkle 3s ease-in-out infinite; }
      .star:nth-child(2) { animation-delay: 0.6s; }
      .star:nth-child(3) { animation-delay: 1.2s; }
      .star:nth-child(4) { animation-delay: 1.8s; }
      .star:nth-child(5) { animation-delay: 2.4s; }
    </style>
  </defs>
  <!-- front hills (pixel) -->
  <g class="wave1" fill="#cba6f7">
    <rect x="0"   y="0"  width="40" height="28"/>
    <rect x="40"  y="0"  width="40" height="32"/>
    <rect x="80"  y="0"  width="40" height="24"/>
    <rect x="120" y="0"  width="40" height="32"/>
    <rect x="160" y="0"  width="40" height="28"/>
    <rect x="200" y="0"  width="40" height="32"/>
    <rect x="240" y="0"  width="40" height="24"/>
    <rect x="280" y="0"  width="40" height="32"/>
    <rect x="320" y="0"  width="40" height="28"/>
    <rect x="360" y="0"  width="40" height="32"/>
    <rect x="400" y="0"  width="40" height="24"/>
    <rect x="440" y="0"  width="40" height="32"/>
    <rect x="480" y="0"  width="40" height="28"/>
    <rect x="520" y="0"  width="40" height="32"/>
    <rect x="560" y="0"  width="40" height="24"/>
    <rect x="600" y="0"  width="40" height="32"/>
    <rect x="640" y="0"  width="40" height="28"/>
    <rect x="680" y="0"  width="40" height="32"/>
    <rect x="720" y="0"  width="40" height="24"/>
    <rect x="760" y="0"  width="40" height="32"/>
  </g>
  <!-- back hills (pixel) -->
  <g class="wave2" fill="#89b4fa" opacity="0.6">
    <rect x="0"   y="24" width="40" height="20"/>
    <rect x="40"  y="28" width="40" height="16"/>
    <rect x="80"  y="20" width="40" height="24"/>
    <rect x="120" y="28" width="40" height="16"/>
    <rect x="160" y="24" width="40" height="20"/>
    <rect x="200" y="28" width="40" height="16"/>
    <rect x="240" y="20" width="40" height="24"/>
    <rect x="280" y="28" width="40" height="16"/>
    <rect x="320" y="24" width="40" height="20"/>
    <rect x="360" y="28" width="40" height="16"/>
    <rect x="400" y="20" width="40" height="24"/>
    <rect x="440" y="28" width="40" height="16"/>
    <rect x="480" y="24" width="40" height="20"/>
    <rect x="520" y="28" width="40" height="16"/>
    <rect x="560" y="20" width="40" height="24"/>
    <rect x="600" y="28" width="40" height="16"/>
    <rect x="640" y="24" width="40" height="20"/>
    <rect x="680" y="28" width="40" height="16"/>
    <rect x="720" y="20" width="40" height="24"/>
    <rect x="760" y="28" width="40" height="16"/>
  </g>
  <!-- night sky bands -->
  <g fill="#45475a">
    <rect x="0" y="44" width="800" height="8"/>
  </g>
  <g fill="#313244">
    <rect x="0" y="52" width="800" height="14"/>
  </g>
  <g fill="#1e1e2e">
    <rect x="0" y="66" width="800" height="14"/>
  </g>
  <!-- twinkling stars in night sky -->
  <g fill="#f9e2af">
    <rect class="star" x="60"  y="56" width="4" height="4"/>
    <rect class="star" x="180" y="62" width="4" height="4"/>
    <rect class="star" x="340" y="58" width="4" height="4"/>
    <rect class="star" x="500" y="64" width="4" height="4"/>
    <rect class="star" x="680" y="56" width="4" height="4"/>
  </g>
  <!-- crescent moon (pixel) -->
  <g fill="#f9e2af">
    <rect x="730" y="50" width="4" height="4"/>
    <rect x="726" y="54" width="4" height="4"/>
    <rect x="724" y="58" width="4" height="4"/>
    <rect x="726" y="62" width="4" height="4"/>
    <rect x="730" y="66" width="4" height="4"/>
  </g>
</svg>
