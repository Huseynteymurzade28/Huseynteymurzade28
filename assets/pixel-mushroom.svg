<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 60" shape-rendering="crispEdges">
  <defs>
    <style>
      @keyframes bounce {
        0%, 100% { transform: translateY(0); }
        50%      { transform: translateY(-1px); }
      }
      @keyframes twinkle {
        0%, 100% { opacity: 0.3; }
        50%      { opacity: 1; }
      }
      .mushroom { animation: bounce 3s ease-in-out infinite; }
      .spark1 { animation: twinkle 2.5s ease-in-out infinite; }
      .spark2 { animation: twinkle 2.5s ease-in-out infinite 0.8s; }
      .spark3 { animation: twinkle 2.5s ease-in-out infinite 1.6s; }
    </style>
  </defs>

  <!-- big mushroom -->
  <g class="mushroom">
    <!-- cap -->
    <rect x="20" y="20" width="20" height="2" fill="#a86a8e"/>
    <rect x="16" y="22" width="28" height="2" fill="#a86a8e"/>
    <rect x="14" y="24" width="32" height="4" fill="#a86a8e"/>
    <rect x="14" y="28" width="32" height="2" fill="#6e4e6e"/>

    <!-- cap dots (cream colored) -->
    <rect x="20" y="24" width="3" height="2" fill="#f9e2af"/>
    <rect x="27" y="22" width="3" height="2" fill="#f9e2af"/>
    <rect x="34" y="26" width="3" height="2" fill="#f9e2af"/>

    <!-- highlight on cap -->
    <rect x="18" y="22" width="2" height="2" fill="#cdd6f4" opacity="0.3"/>

    <!-- stem -->
    <rect x="24" y="30" width="12" height="2"  fill="#cdd6f4"/>
    <rect x="24" y="32" width="12" height="10" fill="#bac2de"/>
    <rect x="26" y="42" width="8"  height="2"  fill="#9399b2"/>

    <!-- stem shadow line -->
    <rect x="34" y="32" width="2" height="10" fill="#9399b2"/>
  </g>

  <!-- small mushroom (right) -->
  <g class="mushroom">
    <rect x="44" y="38" width="8"  height="2" fill="#74c7ec"/>
    <rect x="42" y="40" width="12" height="2" fill="#74c7ec"/>
    <rect x="44" y="42" width="2"  height="6" fill="#cdd6f4"/>
    <rect x="48" y="42" width="2"  height="6" fill="#cdd6f4"/>
    <!-- dot -->
    <rect x="46" y="40" width="2" height="2" fill="#f9e2af"/>
  </g>

  <!-- grass blades -->
  <rect x="8"  y="46" width="1" height="3" fill="#a6e3a1"/>
  <rect x="10" y="44" width="1" height="5" fill="#a6e3a1"/>
  <rect x="52" y="46" width="1" height="3" fill="#a6e3a1"/>

  <!-- sparkles -->
  <rect class="spark1" x="8"  y="22" width="1" height="1" fill="#f9e2af"/>
  <rect class="spark2" x="50" y="18" width="1" height="1" fill="#cba6f7"/>
  <rect class="spark3" x="12" y="34" width="1" height="1" fill="#89b4fa"/>
</svg>
