<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 120" shape-rendering="crispEdges" preserveAspectRatio="none">
  <defs>
    <style>
      @keyframes drift-slow { 0%,100% { transform: translateX(0); } 50% { transform: translateX(-6px); } }
      @keyframes drift-med  { 0%,100% { transform: translateX(0); } 50% { transform: translateX(10px); } }
      @keyframes drift-fast { 0%,100% { transform: translateX(0); } 50% { transform: translateX(-14px); } }
      @keyframes twinkle    { 0%,100% { opacity: 0.2; } 50% { opacity: 1; } }
      @keyframes pulse      { 0%,100% { opacity: 0.6; } 50% { opacity: 1; } }
      .cloud1 { animation: drift-slow 12s ease-in-out infinite; }
      .cloud2 { animation: drift-med  10s ease-in-out infinite; }
      .mtn-back  { animation: drift-slow 14s ease-in-out infinite; }
      .mtn-front { animation: drift-fast 10s ease-in-out infinite; }
      .star { animation: twinkle 3s ease-in-out infinite; }
      .star:nth-of-type(2) { animation-delay: 0.5s; }
      .star:nth-of-type(3) { animation-delay: 1s; }
      .star:nth-of-type(4) { animation-delay: 1.5s; }
      .star:nth-of-type(5) { animation-delay: 2s; }
      .star:nth-of-type(6) { animation-delay: 2.5s; }
      .star:nth-of-type(7) { animation-delay: 0.3s; }
      .sun  { animation: pulse 4s ease-in-out infinite; }
    </style>
  </defs>

  <!-- sky gradient bands (dark to light) -->
  <rect x="0" y="0"  width="800" height="12" fill="#1e1e2e"/>
  <rect x="0" y="12" width="800" height="10" fill="#302a4a"/>
  <rect x="0" y="22" width="800" height="10" fill="#4a3a6e"/>
  <rect x="0" y="32" width="800" height="10" fill="#6e4e88"/>
  <rect x="0" y="42" width="800" height="10" fill="#a86a8e"/>
  <rect x="0" y="52" width="800" height="8"  fill="#d68a8a"/>
  <rect x="0" y="60" width="800" height="6"  fill="#e8a890"/>

  <!-- stars in dark band -->
  <g fill="#f9e2af">
    <rect class="star" x="60"  y="6"  width="3" height="3"/>
    <rect class="star" x="180" y="14" width="3" height="3"/>
    <rect class="star" x="280" y="4"  width="3" height="3"/>
    <rect class="star" x="420" y="10" width="3" height="3"/>
    <rect class="star" x="560" y="6"  width="3" height="3"/>
    <rect class="star" x="700" y="12" width="3" height="3"/>
    <rect class="star" x="760" y="4"  width="3" height="3"/>
  </g>

  <!-- sun rising -->
  <g class="sun">
    <rect x="650" y="46" width="6" height="6"  fill="#f9e2af"/>
    <rect x="644" y="52" width="18" height="6" fill="#f9e2af"/>
    <rect x="650" y="58" width="6" height="4"  fill="#fab387"/>
  </g>

  <!-- back mountains (silhouette) -->
  <g class="mtn-back" fill="#3a2e5e">
    <rect x="0"   y="62" width="80" height="58"/>
    <rect x="80"  y="58" width="40" height="62"/>
    <rect x="120" y="54" width="40" height="66"/>
    <rect x="160" y="58" width="40" height="62"/>
    <rect x="200" y="62" width="80" height="58"/>
    <rect x="280" y="56" width="40" height="64"/>
    <rect x="320" y="52" width="40" height="68"/>
    <rect x="360" y="56" width="40" height="64"/>
    <rect x="400" y="62" width="80" height="58"/>
    <rect x="480" y="58" width="40" height="62"/>
    <rect x="520" y="54" width="40" height="66"/>
    <rect x="560" y="58" width="40" height="62"/>
    <rect x="600" y="62" width="80" height="58"/>
    <rect x="680" y="56" width="40" height="64"/>
    <rect x="720" y="60" width="40" height="60"/>
    <rect x="760" y="62" width="40" height="58"/>
  </g>

  <!-- back mountain highlights (snow caps) -->
  <g class="mtn-back" fill="#5a4a8e">
    <rect x="120" y="54" width="8" height="4"/>
    <rect x="124" y="58" width="12" height="4"/>
    <rect x="320" y="52" width="8" height="4"/>
    <rect x="324" y="56" width="12" height="4"/>
    <rect x="520" y="54" width="8" height="4"/>
    <rect x="524" y="58" width="12" height="4"/>
  </g>

  <!-- clouds drifting -->
  <g class="cloud1" fill="#f5c2e7" opacity="0.7">
    <rect x="100" y="34" width="32" height="4"/>
    <rect x="96"  y="38" width="40" height="4"/>
    <rect x="400" y="30" width="36" height="4"/>
    <rect x="396" y="34" width="44" height="4"/>
  </g>
  <g class="cloud2" fill="#cba6f7" opacity="0.5">
    <rect x="240" y="26" width="28" height="4"/>
    <rect x="236" y="30" width="36" height="4"/>
    <rect x="600" y="38" width="32" height="4"/>
    <rect x="596" y="42" width="40" height="4"/>
  </g>

  <!-- front mountains (closer, darker, with texture) -->
  <g class="mtn-front" fill="#1e1830">
    <rect x="-20" y="84" width="60" height="40"/>
    <rect x="40"  y="78" width="40" height="42"/>
    <rect x="80"  y="72" width="40" height="48"/>
    <rect x="120" y="78" width="40" height="42"/>
    <rect x="160" y="86" width="60" height="34"/>
    <rect x="220" y="80" width="40" height="40"/>
    <rect x="260" y="74" width="40" height="46"/>
    <rect x="300" y="80" width="40" height="40"/>
    <rect x="340" y="86" width="60" height="34"/>
    <rect x="400" y="78" width="40" height="42"/>
    <rect x="440" y="72" width="40" height="48"/>
    <rect x="480" y="78" width="40" height="42"/>
    <rect x="520" y="86" width="60" height="34"/>
    <rect x="580" y="80" width="40" height="40"/>
    <rect x="620" y="74" width="40" height="46"/>
    <rect x="660" y="80" width="40" height="40"/>
    <rect x="700" y="86" width="60" height="34"/>
    <rect x="760" y="80" width="60" height="40"/>
  </g>

  <!-- front mountain peak highlights (sunset glow) -->
  <g class="mtn-front" fill="#a86a8e" opacity="0.4">
    <rect x="80"  y="72" width="40" height="6"/>
    <rect x="260" y="74" width="40" height="6"/>
    <rect x="440" y="72" width="40" height="6"/>
    <rect x="620" y="74" width="40" height="6"/>
  </g>

  <!-- tiny pixel trees on front mountains -->
  <g fill="#74c7ec">
    <rect x="50"  y="100" width="2" height="6"/>
    <rect x="48"  y="104" width="6" height="4"/>
    <rect x="200" y="98"  width="2" height="6"/>
    <rect x="198" y="102" width="6" height="4"/>
    <rect x="380" y="100" width="2" height="6"/>
    <rect x="378" y="104" width="6" height="4"/>
    <rect x="550" y="102" width="2" height="6"/>
    <rect x="548" y="106" width="6" height="4"/>
    <rect x="720" y="100" width="2" height="6"/>
    <rect x="718" y="104" width="6" height="4"/>
  </g>
</svg>
