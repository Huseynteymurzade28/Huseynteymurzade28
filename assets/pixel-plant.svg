<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 60" shape-rendering="crispEdges">
  <defs>
    <style>
      @keyframes sway-left {
        0%, 100% { transform: rotate(-2deg); }
        50%      { transform: rotate(2deg); }
      }
      @keyframes sway-right {
        0%, 100% { transform: rotate(2deg); }
        50%      { transform: rotate(-2deg); }
      }
      @keyframes twinkle {
        0%, 100% { opacity: 0.3; }
        50%      { opacity: 1; }
      }
      .leaf-left  { animation: sway-left  4s ease-in-out infinite; transform-origin: 22px 36px; }
      .leaf-right { animation: sway-right 4s ease-in-out infinite; transform-origin: 38px 36px; }
      .leaf-mid   { animation: sway-left  3s ease-in-out infinite; transform-origin: 30px 30px; }
      .spark1 { animation: twinkle 2.5s ease-in-out infinite; }
      .spark2 { animation: twinkle 2.5s ease-in-out infinite 1s; }
    </style>
  </defs>

  <!-- left leaf -->
  <g class="leaf-left">
    <rect x="18" y="24" width="2" height="2" fill="#a6e3a1"/>
    <rect x="16" y="26" width="6" height="2" fill="#a6e3a1"/>
    <rect x="14" y="28" width="8" height="2" fill="#a6e3a1"/>
    <rect x="16" y="30" width="6" height="2" fill="#74c7ec"/>
    <rect x="20" y="32" width="2" height="4" fill="#a6e3a1"/>
  </g>

  <!-- middle (tallest) leaf -->
  <g class="leaf-mid">
    <rect x="28" y="16" width="2" height="2" fill="#a6e3a1"/>
    <rect x="26" y="18" width="6" height="2" fill="#a6e3a1"/>
    <rect x="24" y="20" width="10" height="2" fill="#a6e3a1"/>
    <rect x="26" y="22" width="6" height="2" fill="#74c7ec"/>
    <rect x="28" y="24" width="2" height="12" fill="#a6e3a1"/>
  </g>

  <!-- right leaf -->
  <g class="leaf-right">
    <rect x="40" y="24" width="2" height="2" fill="#a6e3a1"/>
    <rect x="38" y="26" width="6" height="2" fill="#a6e3a1"/>
    <rect x="38" y="28" width="8" height="2" fill="#a6e3a1"/>
    <rect x="38" y="30" width="6" height="2" fill="#74c7ec"/>
    <rect x="38" y="32" width="2" height="4" fill="#a6e3a1"/>
  </g>

  <!-- pot -->
  <rect x="20" y="38" width="20" height="2" fill="#a86a8e"/>
  <rect x="22" y="40" width="16" height="8" fill="#a86a8e"/>
  <rect x="24" y="42" width="12" height="2" fill="#d68a8a"/>
  <rect x="24" y="48" width="12" height="2" fill="#6e4e3a"/>

  <!-- sparkles -->
  <rect class="spark1" x="10" y="20" width="1" height="1" fill="#f9e2af"/>
  <rect class="spark2" x="48" y="18" width="1" height="1" fill="#cba6f7"/>
</svg>
