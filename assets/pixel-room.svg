<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" shape-rendering="crispEdges">
  <defs>
    <style>
      @keyframes screen-flicker {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.85; }
      }
      @keyframes cursor-blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      @keyframes steam {
        0%   { transform: translateY(0)  scaleX(1); opacity: 0.8; }
        50%  { transform: translateY(-4px) scaleX(1.1); opacity: 0.5; }
        100% { transform: translateY(-8px) scaleX(0.9); opacity: 0; }
      }
      @keyframes lamp-glow {
        0%, 100% { opacity: 0.7; }
        50%      { opacity: 1; }
      }
      @keyframes plant-sway {
        0%, 100% { transform: rotate(-1deg); }
        50%      { transform: rotate(1deg); }
      }
      @keyframes text-scroll {
        0%   { transform: translateY(0); }
        100% { transform: translateY(-12px); }
      }
      .screen   { animation: screen-flicker 4s ease-in-out infinite; }
      .cursor   { animation: cursor-blink 1s steps(1) infinite; }
      .steam1   { animation: steam 3s ease-out infinite; }
      .steam2   { animation: steam 3s ease-out infinite 1s; }
      .steam3   { animation: steam 3s ease-out infinite 2s; }
      .lamp     { animation: lamp-glow 3s ease-in-out infinite; }
      .plant    { animation: plant-sway 4s ease-in-out infinite; transform-origin: 30px 145px; }
      .code-lines { animation: text-scroll 6s linear infinite; }
    </style>
  </defs>

  <!-- room background (wall) -->
  <rect x="0" y="0" width="200" height="200" fill="#1e1e2e"/>

  <!-- window (left) -->
  <rect x="10" y="20" width="50" height="60" fill="#181825"/>
  <rect x="10" y="20" width="50" height="2"  fill="#45475a"/>
  <rect x="10" y="78" width="50" height="2"  fill="#45475a"/>
  <rect x="10" y="20" width="2"  height="60" fill="#45475a"/>
  <rect x="58" y="20" width="2"  height="60" fill="#45475a"/>
  <rect x="34" y="22" width="2"  height="56" fill="#45475a"/>
  <rect x="12" y="48" width="46" height="2"  fill="#45475a"/>
  <!-- night sky in window -->
  <rect x="12" y="22" width="22" height="26" fill="#302a4a"/>
  <rect x="36" y="22" width="22" height="26" fill="#302a4a"/>
  <rect x="12" y="50" width="22" height="28" fill="#4a3a6e"/>
  <rect x="36" y="50" width="22" height="28" fill="#4a3a6e"/>
  <!-- stars in window -->
  <rect x="18" y="28" width="2" height="2" fill="#f9e2af" class="cursor"/>
  <rect x="28" y="36" width="2" height="2" fill="#f9e2af"/>
  <rect x="42" y="30" width="2" height="2" fill="#f9e2af" class="cursor"/>
  <rect x="50" y="40" width="2" height="2" fill="#f9e2af"/>
  <!-- crescent moon in window -->
  <rect x="44" y="26" width="6" height="2" fill="#f9e2af"/>
  <rect x="42" y="28" width="8" height="2" fill="#f9e2af"/>
  <rect x="42" y="30" width="8" height="2" fill="#f9e2af"/>
  <rect x="44" y="32" width="6" height="2" fill="#f9e2af"/>
  <rect x="46" y="28" width="6" height="2" fill="#302a4a"/>
  <rect x="46" y="30" width="6" height="2" fill="#302a4a"/>

  <!-- desk (wood) -->
  <rect x="0"   y="150" width="200" height="6"  fill="#6e4e3a"/>
  <rect x="0"   y="156" width="200" height="14" fill="#4a2e1e"/>
  <rect x="20"  y="170" width="4"   height="30" fill="#4a2e1e"/>
  <rect x="176" y="170" width="4"   height="30" fill="#4a2e1e"/>

  <!-- monitor on desk -->
  <rect x="70"  y="90"  width="70" height="50" fill="#11111b"/>
  <rect x="72"  y="92"  width="66" height="42" fill="#1e1e2e" class="screen"/>
  <!-- monitor stand -->
  <rect x="98"  y="140" width="14" height="6"  fill="#11111b"/>
  <rect x="90"  y="146" width="30" height="4"  fill="#11111b"/>

  <!-- code on screen (scrolling) -->
  <g class="code-lines">
    <rect x="76"  y="98"  width="20" height="2" fill="#a6e3a1"/>
    <rect x="98"  y="98"  width="14" height="2" fill="#cba6f7"/>
    <rect x="76"  y="104" width="8"  height="2" fill="#fab387"/>
    <rect x="86"  y="104" width="28" height="2" fill="#89b4fa"/>
    <rect x="80"  y="110" width="24" height="2" fill="#f9e2af"/>
    <rect x="76"  y="116" width="16" height="2" fill="#a6e3a1"/>
    <rect x="94"  y="116" width="20" height="2" fill="#f5c2e7"/>
    <rect x="80"  y="122" width="12" height="2" fill="#cba6f7"/>
    <rect x="94"  y="122" width="18" height="2" fill="#89b4fa"/>
    <rect x="76"  y="128" width="22" height="2" fill="#fab387"/>
    <!-- duplicate set for seamless scroll -->
    <rect x="76"  y="134" width="20" height="2" fill="#a6e3a1"/>
    <rect x="98"  y="134" width="14" height="2" fill="#cba6f7"/>
  </g>
  <!-- screen mask (top and bottom edges) -->
  <rect x="72"  y="92"  width="66" height="6"  fill="#1e1e2e"/>
  <rect x="72"  y="128" width="66" height="6"  fill="#1e1e2e"/>
  <!-- blinking cursor on screen -->
  <rect x="116" y="122" width="3" height="3" fill="#a6e3a1" class="cursor"/>

  <!-- keyboard -->
  <rect x="78" y="148" width="50" height="6" fill="#313244"/>
  <rect x="80" y="150" width="3"  height="2" fill="#45475a"/>
  <rect x="85" y="150" width="3"  height="2" fill="#45475a"/>
  <rect x="90" y="150" width="3"  height="2" fill="#45475a"/>
  <rect x="95" y="150" width="3"  height="2" fill="#45475a"/>
  <rect x="100" y="150" width="3" height="2" fill="#45475a"/>
  <rect x="105" y="150" width="3" height="2" fill="#45475a"/>
  <rect x="110" y="150" width="3" height="2" fill="#45475a"/>
  <rect x="115" y="150" width="3" height="2" fill="#45475a"/>
  <rect x="120" y="150" width="3" height="2" fill="#45475a"/>

  <!-- coffee mug (right of monitor) -->
  <g>
    <rect x="148" y="138" width="14" height="12" fill="#cba6f7"/>
    <rect x="150" y="140" width="10" height="8"  fill="#4a2e1e"/>
    <rect x="162" y="140" width="2"  height="6"  fill="#cba6f7"/>
    <rect x="164" y="142" width="2"  height="2"  fill="#cba6f7"/>
    <!-- steam -->
    <g class="steam1">
      <rect x="152" y="132" width="2" height="2" fill="#cdd6f4" opacity="0.7"/>
      <rect x="154" y="130" width="2" height="2" fill="#cdd6f4" opacity="0.6"/>
    </g>
    <g class="steam2">
      <rect x="156" y="132" width="2" height="2" fill="#cdd6f4" opacity="0.7"/>
      <rect x="158" y="130" width="2" height="2" fill="#cdd6f4" opacity="0.6"/>
    </g>
    <g class="steam3">
      <rect x="154" y="134" width="2" height="2" fill="#cdd6f4" opacity="0.7"/>
    </g>
  </g>

  <!-- desk lamp (right) -->
  <rect x="170" y="120" width="2"  height="30" fill="#45475a"/>
  <rect x="166" y="116" width="14" height="4"  fill="#45475a"/>
  <rect x="168" y="120" width="10" height="2"  fill="#fab387"/>
  <!-- lamp glow -->
  <g class="lamp">
    <rect x="164" y="122" width="2"  height="2" fill="#fab387" opacity="0.4"/>
    <rect x="180" y="122" width="2"  height="2" fill="#fab387" opacity="0.4"/>
    <rect x="162" y="126" width="2"  height="2" fill="#fab387" opacity="0.2"/>
    <rect x="182" y="126" width="2"  height="2" fill="#fab387" opacity="0.2"/>
  </g>

  <!-- plant on desk (left) -->
  <g class="plant">
    <!-- pot -->
    <rect x="22" y="138" width="16" height="12" fill="#a86a8e"/>
    <rect x="24" y="140" width="12" height="2"  fill="#d68a8a"/>
    <!-- leaves -->
    <rect x="28" y="130" width="4"  height="8" fill="#a6e3a1"/>
    <rect x="24" y="128" width="4"  height="6" fill="#a6e3a1"/>
    <rect x="32" y="126" width="4"  height="8" fill="#a6e3a1"/>
    <rect x="20" y="132" width="4"  height="6" fill="#74c7ec"/>
    <rect x="36" y="130" width="4"  height="8" fill="#74c7ec"/>
    <rect x="28" y="122" width="2"  height="6" fill="#a6e3a1"/>
    <rect x="34" y="120" width="2"  height="6" fill="#a6e3a1"/>
  </g>

  <!-- floating sparkles -->
  <rect x="60"  y="100" width="2" height="2" fill="#f5c2e7" class="cursor"/>
  <rect x="148" y="110" width="2" height="2" fill="#a6e3a1" class="cursor"/>
  <rect x="64"  y="120" width="2" height="2" fill="#cba6f7" class="cursor"/>
</svg>
