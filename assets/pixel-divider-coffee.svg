<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 20" shape-rendering="crispEdges">
  <defs>
    <style>
      @keyframes steam-rise {
        0%   { transform: translateY(0)   scaleX(1);   opacity: 0.8; }
        50%  { transform: translateY(-2px) scaleX(1.1); opacity: 0.5; }
        100% { transform: translateY(-4px) scaleX(0.9); opacity: 0; }
      }
      @keyframes twinkle {
        0%, 100% { opacity: 0.3; }
        50%      { opacity: 1; }
      }
      .steam1 { animation: steam-rise 2.5s ease-out infinite; }
      .steam2 { animation: steam-rise 2.5s ease-out infinite 0.8s; }
      .steam3 { animation: steam-rise 2.5s ease-out infinite 1.6s; }
      .leaf   { animation: twinkle 3s ease-in-out infinite; }
    </style>
  </defs>

  <!-- left line -->
  <rect x="40"  y="10" width="120" height="1" fill="#45475a"/>
  <rect x="50"  y="9"  width="2"   height="1" fill="#45475a" opacity="0.5"/>
  <rect x="70"  y="9"  width="2"   height="1" fill="#45475a" opacity="0.5"/>
  <rect x="90"  y="9"  width="2"   height="1" fill="#45475a" opacity="0.5"/>
  <rect x="110" y="9"  width="2"   height="1" fill="#45475a" opacity="0.5"/>
  <rect x="130" y="9"  width="2"   height="1" fill="#45475a" opacity="0.5"/>

  <!-- tiny leaf left of cup -->
  <g class="leaf" fill="#a6e3a1">
    <rect x="170" y="8" width="2" height="2"/>
    <rect x="172" y="6" width="2" height="2"/>
  </g>

  <!-- pixel coffee cup -->
  <g>
    <!-- steam wisps -->
    <g class="steam1" fill="#cdd6f4" opacity="0.7">
      <rect x="190" y="2" width="1" height="1"/>
      <rect x="191" y="1" width="1" height="1"/>
    </g>
    <g class="steam2" fill="#cdd6f4" opacity="0.7">
      <rect x="194" y="2" width="1" height="1"/>
      <rect x="195" y="1" width="1" height="1"/>
    </g>
    <g class="steam3" fill="#cdd6f4" opacity="0.7">
      <rect x="198" y="2" width="1" height="1"/>
      <rect x="199" y="1" width="1" height="1"/>
    </g>
    <!-- cup body -->
    <rect x="186" y="6"  width="14" height="2" fill="#cba6f7"/>
    <rect x="186" y="8"  width="14" height="6" fill="#cba6f7"/>
    <!-- coffee surface -->
    <rect x="188" y="6"  width="10" height="2" fill="#4a2e1e"/>
    <!-- cup handle -->
    <rect x="200" y="8"  width="2"  height="4" fill="#cba6f7"/>
    <rect x="202" y="9"  width="1"  height="2" fill="#cba6f7"/>
    <!-- saucer -->
    <rect x="184" y="14" width="18" height="1" fill="#a86a8e"/>
  </g>

  <!-- tiny leaf right of cup -->
  <g class="leaf" fill="#a6e3a1">
    <rect x="208" y="8" width="2" height="2"/>
    <rect x="206" y="6" width="2" height="2"/>
  </g>

  <!-- right line -->
  <rect x="220" y="10" width="120" height="1" fill="#45475a"/>
  <rect x="240" y="9"  width="2"   height="1" fill="#45475a" opacity="0.5"/>
  <rect x="260" y="9"  width="2"   height="1" fill="#45475a" opacity="0.5"/>
  <rect x="280" y="9"  width="2"   height="1" fill="#45475a" opacity="0.5"/>
  <rect x="300" y="9"  width="2"   height="1" fill="#45475a" opacity="0.5"/>
  <rect x="320" y="9"  width="2"   height="1" fill="#45475a" opacity="0.5"/>
</svg>
