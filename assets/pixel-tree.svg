<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 60" shape-rendering="crispEdges">
  <defs>
    <style>
      @keyframes sway {
        0%, 100% { transform: rotate(-1deg); }
        50%      { transform: rotate(1deg); }
      }
      @keyframes twinkle {
        0%, 100% { opacity: 0.3; }
        50%      { opacity: 1; }
      }
      .tree   { animation: sway 4s ease-in-out infinite; transform-origin: 30px 50px; }
      .spark1 { animation: twinkle 2.5s ease-in-out infinite; }
      .spark2 { animation: twinkle 2.5s ease-in-out infinite 1s; }
    </style>
  </defs>

  <g class="tree">
    <!-- trunk -->
    <rect x="28" y="42" width="4" height="10" fill="#6e4e3a"/>
    <rect x="28" y="44" width="2" height="6"  fill="#4a2e1e"/>

    <!-- foliage layer 1 (top, pointed) -->
    <rect x="28" y="14" width="4"  height="4" fill="#a6e3a1"/>
    <rect x="26" y="18" width="8"  height="4" fill="#a6e3a1"/>

    <!-- foliage layer 2 -->
    <rect x="24" y="22" width="12" height="4" fill="#74c7ec"/>
    <rect x="22" y="26" width="16" height="4" fill="#74c7ec"/>

    <!-- foliage layer 3 (widest) -->
    <rect x="20" y="30" width="20" height="4" fill="#a6e3a1"/>
    <rect x="22" y="34" width="16" height="4" fill="#a6e3a1"/>
    <rect x="24" y="38" width="12" height="4" fill="#a6e3a1"/>

    <!-- highlights -->
    <rect x="26" y="22" width="2" height="2" fill="#cdd6f4" opacity="0.4"/>
    <rect x="24" y="30" width="2" height="2" fill="#cdd6f4" opacity="0.4"/>
  </g>

  <!-- floating sparkles around tree -->
  <rect class="spark1" x="12" y="20" width="1" height="1" fill="#f9e2af"/>
  <rect class="spark2" x="48" y="28" width="1" height="1" fill="#f9e2af"/>
  <rect class="spark1" x="8"  y="40" width="1" height="1" fill="#cba6f7"/>
</svg>
